name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build image and render a clip
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the SAM template
        run: sam validate --lint
      - name: Build the image
        run: docker build -t spectrogram-renderer core
      - name: Render a clip the way Lambda runs it
        # Unprivileged, root-owned /tmp, and the CPU and memory of the 1024 MB tier.
        run: |
          docker run --rm --user 1000:1000 --tmpfs /tmp:uid=0,gid=0,mode=1777 \
            --cpus 0.58 --memory 1024m --entrypoint python \
            -v "$PWD/tests/smoke.py:/var/task/smoke.py" spectrogram-renderer smoke.py

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - run: sam build
      - run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
